services:

  database:
    image: postgres:18-alpine

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - quitanda-db-data:/var/lib/postgresql
      - ./backend/db/bkt_quitanda.sql:/docker-entrypoint-initdb.d/bkt_quitanda.dump:ro
      - ./backend/db/restore.sh:/docker-entrypoint-initdb.d/01-restore.sh:ro

    networks:
      - quitanda-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend

    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASS}
      DB_HOST: database
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}

    ports:
      - "3000:3000"

    networks:
      - quitanda-network

    depends_on:
      database:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/frutas').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend

    environment:
      VITE_API_URL: http://localhost:3000

    ports:
      - "8080:8080"

    networks:
      - quitanda-network

    depends_on:
      backend:
        condition: service_healthy


networks:
  quitanda-network:
    driver: bridge


volumes:
  quitanda-db-data: